name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**/*.dvc'
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - '.dvc/config'
      - '.github/workflows/cicd.yml'
      - 'requirements.txt'
      - 'params.yaml'
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

concurrency:
  group: income-cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/ -v

  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Pull data with DVC
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          dvc remote add --local --force -d labstore "s3://${ARTIFACT_BUCKET}/dvc"
          dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc
      - name: Train model
        run: python src/train.py
      - name: Read report
        id: read_report
        run: |
          python - <<'PY'
          import json, os
          with open('outputs/report.json') as f:
              report = json.load(f)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"f1={report['f1_score']}\n")
          PY
      - name: Save candidate model and report
        uses: actions/upload-artifact@v4
        with:
          name: candidate-model
          if-no-files-found: error
          path: |
            models/model.joblib
            outputs/report.json

  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: candidate-model
      - name: Check positive-class F1
        run: python src/quality_gate.py outputs/report.json

  release:
    name: Release
    needs: [train, quality-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: candidate-model
      - run: python -m pip install 'boto3>=1.34,<2'
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Publish approved model to S3
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: python -m src.publish_model
      - name: Copy serving code to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: src/serve.py
          target: /home/${{ secrets.SERVER_USER }}
      - name: Restart API and check readiness
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -eu
            sudo -n systemctl restart income-api
            for attempt in $(seq 1 30); do
              if curl -fsS http://localhost:8080/healthz; then
                echo 'Health check passed.'
                exit 0
              fi
              sleep 2
            done
            echo 'Health check failed.' >&2
            exit 1
